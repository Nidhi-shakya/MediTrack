services:
  - type: web
    name: meditrack-clinic
    env: node
    plan: free
    buildCommand: npm --prefix frontend install && npm --prefix frontend run build && npm --prefix backend install
    startCommand: node backend/server.js
    envVars:
      - key: PORT
        value: 5000
      - key: STAFF_PIN
        value: 1234
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false

